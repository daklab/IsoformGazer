[project]
name = "isoformgazer"
version = "0.1.0"
description = ""
authors = [
    {name = "=",email = "jtl2189@columbia.edu"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dash (>=3.0.4,<4.0.0)",
    "dash-core-components (>=2.0.0,<3.0.0)",
    "dash-html-components (>=2.0.0,<3.0.0)",
    "plotly (>=6.0.1,<7.0.0)",
    "numpy (>=2.2.5,<3.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "dash-table (>=5.0.0,<6.0.0)",
    "colorama (>=0.4.6,<0.5.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "matplotlib (>=3.10.3,<4.0.0)",
    "scipy (>=1.15.3,<2.0.0)",
    "dash-bio (>=1.0.2,<2.0.0)",
    "gffutils (>=0.13,<0.14)",
    "dash-daq (>=0.6.0,<0.7.0)",
    "requests (>=2.32.4,<3.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "dash-bootstrap-components (>=2.0.3,<3.0.0)",
    "pillow (>=11.3.0,<12.0.0)",
    "urllib3 (>=2.5.0,<3.0.0)",
    "psutil (>=7.0.0,<8.0.0)",
    "memory-profiler (>=0.61.0,<0.62.0)",
    "line-profiler (>=5.0.0,<6.0.0)",
    "pypdf (>=3.9.0,<4.0.0)",
]

[tool.poetry]
packages = [{include = "isoformgazer", from = "src"}]

[tool.poetry.scripts]
bulk-export-plots = "isoformgazer.bulk_export_plots:main"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
